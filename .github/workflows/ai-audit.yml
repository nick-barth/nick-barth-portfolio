# Daily AI-answer audit for the Tebi case study (scripts/ai-audit).
# Runs every prompt on every engine once, prices it, adds a point to the time series
# (audit-history.json) and commits the page data, which redeploys the site on Vercel.
#
# Needs repository secrets: OPENAI_API_KEY, PERPLEXITY_API_KEY, GEMINI_API_KEY
#   gh secret set OPENAI_API_KEY      (paste the key when prompted; it never touches the repo)
name: AI audit

on:
  schedule:
    - cron: "0 5 * * *" # 05:00 UTC daily
  workflow_dispatch:
    inputs:
      runs:
        description: "Runs per prompt"
        default: "1"

permissions:
  contents: write

concurrency:
  group: ai-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Run audit
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: bun run audit --runs=${{ inputs.runs || '1' }}

      # Full answers stay out of git; keep them 90 days as a downloadable artifact
      - uses: actions/upload-artifact@v4
        with:
          name: ai-audit-${{ github.run_id }}
          path: scripts/ai-audit/results/
          retention-days: 90

      - name: Commit page data
        run: |
          git config user.name "ai-audit bot"
          git config user.email "ai-audit@users.noreply.github.com"
          git add app/case-studies/tebi/case-study/audit-data.json \
                  app/case-studies/tebi/case-study/audit-summary.json \
                  app/case-studies/tebi/case-study/audit-history.json
          git diff --cached --quiet || git commit -m "AI audit: $(date -u +%F)"
          git push
